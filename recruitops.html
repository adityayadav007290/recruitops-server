<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecruitOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink-2:#1E2E52;
  --paper:#F6F7F9; --paper-2:#EDEFF3; --white:#FFFFFF;
  --steel:#5C6B7A; --steel-light:#8A97A6;
  --line:#DDE1E7;
  --amber:#E8963A; --amber-bg:#FCF0DE;
  --green:#2F7D5C; --green-bg:#E4F3EC;
  --orange:#D97A34; --orange-bg:#FBEADB;
  --red:#C1443D; --red-bg:#FBE7E5;
  --blue:#2E5AAC; --blue-bg:#E7EDF9;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 4px 14px rgba(20,33,61,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--ink);color:#fff;}
a{color:inherit;}

/* ---------- Auth Screen ---------- */
#authScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(232,150,58,.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(46,90,172,.10), transparent 40%),
    var(--ink);
  padding:24px;
}
.auth-card{
  background:var(--white); width:100%; max-width:400px; border-radius:14px;
  padding:38px 34px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.auth-brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.auth-mark{
  width:34px;height:34px;border-radius:8px;background:var(--ink);
  display:flex;align-items:center;justify-content:center;color:var(--amber);
  font-family:'Fraunces',serif;font-weight:700;font-size:18px;
}
.auth-brand-name{font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:-.01em;}
.auth-sub{color:var(--steel); font-size:13.5px; margin:6px 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--steel); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  font-size:14.5px; background:var(--paper); color:var(--ink); transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--ink);}
.btn{
  border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; gap:6px; transition:transform .1s, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink); color:#fff; width:100%; justify-content:center; padding:11px;}
.btn-primary:hover{background:var(--ink-2);}
.btn-ghost{background:transparent; color:var(--steel); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--steel);}
.btn-amber{background:var(--amber); color:#fff;}
.btn-danger{background:var(--red); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
.auth-error{color:var(--red); font-size:13px; margin-top:-6px; margin-bottom:14px; min-height:16px;}
.demo-accounts{margin-top:22px; padding-top:18px; border-top:1px solid var(--line);}
.demo-accounts p{font-size:11.5px; color:var(--steel-light); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px;}
.demo-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:var(--steel); cursor:pointer;}
.demo-row:hover{color:var(--ink);}
.demo-row span.mono{color:var(--ink);}

/* ---------- App Shell ---------- */
#app{display:none; min-height:100vh; grid-template-columns:220px 1fr;}
#app.active{display:grid;}
#sidebar{
  background:var(--ink); color:#fff; padding:22px 14px; display:flex; flex-direction:column;
}
.side-brand{display:flex; align-items:center; gap:9px; padding:0 8px 22px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:14px;}
.side-mark{width:28px;height:28px;border-radius:7px;background:var(--amber);display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:'Fraunces',serif;font-weight:700;font-size:15px;}
.side-name{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; color:rgba(255,255,255,.68);
  font-size:13.5px; font-weight:500; margin-bottom:2px; cursor:pointer; transition:background .12s, color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.12); color:#fff;}
.nav-ico{width:16px; text-align:center; font-size:14px;}
.side-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.1);}
.side-user{padding:8px; font-size:12.5px; color:rgba(255,255,255,.55); line-height:1.5;}
.side-user b{color:#fff; display:block; font-size:13.5px;}
.role-pill{display:inline-block; margin-top:3px; font-size:10.5px; background:rgba(232,150,58,.18); color:var(--amber); padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
.logout-btn{width:100%; margin-top:10px; background:rgba(255,255,255,.08); color:#fff; text-align:center; justify-content:center; border:none;}
.logout-btn:hover{background:rgba(255,255,255,.15);}

#main{padding:26px 32px 60px; overflow-x:hidden;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.page-title{font-family:'Fraunces',serif; font-size:26px; font-weight:600; letter-spacing:-.01em;}
.page-sub{color:var(--steel); font-size:13.5px; margin-top:2px;}

.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.select-sm{padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; color:var(--ink);}

/* KPI cards */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:14px; margin-bottom:22px;}
.kpi-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow);}
.kpi-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel-light); font-weight:600;}
.kpi-value{font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px;}
.kpi-note{font-size:11.5px; color:var(--steel); margin-top:2px;}

.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;}
@media(max-width:1080px){.grid-2{grid-template-columns:1fr;}}

.card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:var(--shadow); margin-bottom:18px;}
.card-title{font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;}

/* funnel */
.funnel-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.funnel-label{width:96px; font-size:12.5px; color:var(--steel); font-weight:600;}
.funnel-bar-wrap{flex:1; background:var(--paper-2); border-radius:6px; height:22px; position:relative; overflow:hidden;}
.funnel-bar{height:100%; background:linear-gradient(90deg,var(--ink),var(--blue)); border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; transition:width .4s;}
.funnel-bar span{color:#fff; font-size:11.5px; font-weight:700;}

/* aging ruler - signature element */
.ruler{display:flex; align-items:center; gap:8px;}
.ruler-track{flex:1; height:6px; background:var(--paper-2); border-radius:4px; position:relative; min-width:60px;}
.ruler-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px;}
.ruler-days{font-size:11.5px; font-weight:700; font-family:'JetBrains Mono',monospace; min-width:44px; text-align:right;}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
.tag-green{background:var(--green-bg); color:var(--green);}
.tag-amber{background:var(--amber-bg); color:var(--amber);}
.tag-orange{background:var(--orange-bg); color:var(--orange);}
.tag-red{background:var(--red-bg); color:var(--red);}
.tag-blue{background:var(--blue-bg); color:var(--blue);}
.tag-gray{background:var(--paper-2); color:var(--steel);}

/* tables */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--steel-light); font-weight:700; padding:0 12px 10px; border-bottom:1px solid var(--line);}
td{padding:12px; border-bottom:1px solid var(--paper-2); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.tbl-row:hover{background:var(--paper-2);}
.name-cell b{display:block; font-size:13.5px;}
.name-cell small{color:var(--steel); font-size:11.5px;}
.icon-btn{background:transparent; border:1px solid var(--line); border-radius:6px; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; color:var(--steel); font-size:13px;}
.icon-btn:hover{border-color:var(--ink); color:var(--ink);}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}
.empty-state{text-align:center; padding:50px 20px; color:var(--steel);}
.empty-state .em-ico{font-size:30px; margin-bottom:10px;}
.empty-state b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px; font-family:'Fraunces',serif;}

/* Kanban */
.kanban{display:flex; gap:14px; overflow-x:auto; padding-bottom:12px;}
.kcol{background:var(--paper-2); border-radius:12px; min-width:230px; max-width:230px; padding:12px; flex-shrink:0;}
.kcol-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 2px;}
.kcol-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--steel);}
.kcol-count{background:#fff; border-radius:20px; padding:1px 8px; font-size:11.5px; font-weight:700; color:var(--ink);}
.kcard{background:#fff; border-radius:9px; padding:11px 12px; margin-bottom:9px; box-shadow:0 1px 3px rgba(20,33,61,.08); cursor:pointer; border:1px solid transparent;}
.kcard:hover{border-color:var(--line);}
.kcard-name{font-weight:700; font-size:13.5px;}
.kcard-req{font-size:11.5px; color:var(--steel); margin-top:2px;}
.kcard-foot{display:flex; justify-content:space-between; align-items:center; margin-top:9px;}
.kcard-rec{font-size:10.5px; color:var(--steel-light); font-weight:600;}
.kcard-move{display:flex; gap:4px;}
.mini-btn{border:none; background:var(--paper-2); border-radius:5px; width:22px; height:20px; font-size:11px; color:var(--ink);}
.mini-btn:hover{background:var(--ink); color:#fff;}
.mini-btn.rej:hover{background:var(--red);}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(20,33,61,.5); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto;}
.modal-overlay.active{display:flex;}
.modal{background:#fff; border-radius:14px; width:100%; max-width:480px; padding:26px 26px 22px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}
.modal-close{background:none;border:none;font-size:18px;color:var(--steel);}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions .btn{flex:1;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* candidate detail */
.timeline{margin-top:6px;}
.tl-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-2);}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--ink); margin-top:5px; flex-shrink:0;}
.tl-body{font-size:13px;}
.tl-time{font-size:11px; color:var(--steel-light); margin-top:1px;}

.toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:9px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:200; opacity:0; transform:translateY(10px); transition:all .25s;}
.toast.show{opacity:1; transform:translateY(0);}

.badge-status{padding:3px 9px; border-radius:5px; font-size:11.5px; font-weight:700;}
.section-note{font-size:12.5px; color:var(--steel); background:var(--paper-2); padding:10px 14px; border-radius:8px; margin-bottom:16px;}
.weights-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.perf-bar-track{background:var(--paper-2); height:8px; border-radius:6px; overflow:hidden;}
.perf-bar-fill{height:100%; background:var(--ink); border-radius:6px;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-mark">R</div>
      <div class="auth-brand-name">RecruitOps</div>
    </div>
    <div class="auth-sub">Requisition-to-joining tracker for staffing teams.</div>
    <div class="field">
      <label>Username</label>
      <input id="loginUser" type="text" placeholder="e.g. admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-error" id="loginError"></div>
    <button class="btn btn-primary" onclick="doLogin()">Log in</button>
    <div class="demo-accounts" style="margin-top:16px; padding-top:14px;">
      <p>Central server</p>
      <div id="serverStatusRow" style="font-size:12.5px; color:var(--steel); display:flex; justify-content:space-between; align-items:center;">
        <span id="serverStatusText" class="mono">checking…</span>
        <a href="#" onclick="promptServerUrl();return false;" style="font-size:12px; font-weight:600;">change</a>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div class="side-brand">
      <div class="side-mark">R</div>
      <div class="side-name">RecruitOps</div>
    </div>
    <div id="navList"></div>
    <div class="side-foot">
      <div class="side-user" id="sideUser"></div>
      <button class="btn logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================= CONSTANTS ============================= */
const STORAGE_KEY = 'recruitops-db-v1';
const STAGES = ['Sourced','Screened','Submitted','Interview','Offer','Joined'];

  performance:{label:'Performance', ico:'&#9733;'},

/* ============================= STATE ============================= */
let DB = null;
let CURRENT_USER = null;

function nowIso(){ return new Date().toISOString(); }

function daysBetween(a,b){ return Math.floor((b-a)/(1000*60*60*24)); }

  const offers = [

  ];
  const joinings = [
    {id:'jn_1', submissionId:'sb_5', actualDate:daysAgo(2), status:'Joined'}
  ];
  const activity = [];
  [submissions].flat().forEach(s=>{
    activity.push({id:uid('ac'), candidateId:s.candidateId, ts:s.createdAt, actor:s.recruiter, text:`Submitted against requirement for stage tracking (initial stage: Sourced).`});
    if(s.stage!=='Sourced') activity.push({id:uid('ac'), candidateId:s.candidateId, ts:s.updatedAt, actor:s.recruiter, text:`Moved to stage "${s.stage}".`});
  });

  return {
    users, clients, requirements, candidates, submissions, interviews, offers, joinings, activity,
    settings:{ weights:{submission:1, interview:2, offer:3, join:5} }
  };
}

/* ============================= PERSISTENCE (Central Server) ============================= */
/* All data lives on one central server, reachable over your network, so every
   teammate's copy of this file reads and writes the same shared dataset. */
const API_BASE_KEY = 'recruitops-api-base';
function getApiBase(){
  const saved = localStorage.getItem(API_BASE_KEY);
  if(saved) return saved;
  // If this page was served BY the central server itself (e.g. opened via
  // https://recruitops-server.onrender.com), talk back to that same server
  // automatically — no manual setup needed. Only fall back to localhost
  // when this file was opened locally (file:// address).
  if(window.location.protocol !== 'file:' && window.location.origin){
    return window.location.origin;
  }
  return 'http://localhost:4000';
}
function setApiBase(url){ localStorage.setItem(API_BASE_KEY, url.replace(/\/+$/,'')); }

async function checkServerStatus(){
  const el = document.getElementById('serverStatusText');
  if(!el) return;
  el.textContent = getApiBase();
  try{
    const res = await fetch(getApiBase()+'/api/health', {cache:'no-store'});
    if(res.ok){ el.style.color='var(--green)'; el.title='Connected'; }
    else throw new Error('bad status');
  }catch(e){
    el.style.color='var(--red)'; el.title='Cannot reach server';
    el.textContent = getApiBase() + ' (unreachable)';
  }
}
function promptServerUrl(){
  const current = getApiBase();
  const val = prompt('Central server URL (ask whoever set up the server for this):', current);
  if(val && val.trim()){ setApiBase(val.trim()); checkServerStatus(); showToast('Server URL updated.'); }
}

async function loadDB(){
  const res = await fetch(getApiBase()+'/api/data', {cache:'no-store'});
  if(!res.ok) throw new Error('Failed to load data from server ('+res.status+').');
  DB = await res.json();
}
async function saveDB(){
  try{
    const res = await fetch(getApiBase()+'/api/data', {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DB)
    });
    if(!res.ok) throw new Error('bad status '+res.status);
  }catch(e){
    console.error('save failed', e);
    showToast('Could not reach the central server — this change was not saved.');
  }
}
function persist(){ saveDB(); }

// Poll for changes made by other users while logged in, skip while a modal is open.
setInterval(async ()=>{
  if(!CURRENT_USER) return;
  if(document.getElementById('modalOverlay').classList.contains('active')) return;
  try{ await loadDB(); renderRoute(); }catch(e){ /* server may be temporarily unreachable */ }
}, 8000);

/* ============================= AUTH ============================= */
function fillLogin(u,p){ document.getElementById('loginUser').value=u; document.getElementById('loginPass').value=p; }
// Role → sidebar access is configurable by Super Admin (Settings → Role Permissions).
// DB.settings.rolePermissions overrides the hardcoded ROLES[role].nav defaults once
// a Super Admin has customized it; falls back to the defaults until then.
function ensureRolePermissions(){
  if(!DB.settings) DB.settings = {};
  if(!DB.settings.rolePermissions) DB.settings.rolePermissions = {};
  Object.keys(ROLES).forEach(r=>{
    if(!DB.settings.rolePermissions[r]) DB.settings.rolePermissions[r] = [...ROLES[r].nav];
  });
  return DB.settings.rolePermissions;
}
function getRoleNav(role){
  const perms = ensureRolePermissions();
  return perms[role] || ROLES[role]?.nav || ['dashboard'];
}
function togglePermission(role, navKey, checked){
  const perms = ensureRolePermissions();
  const list = perms[role] || [];
  if(checked){ if(!list.includes(navKey)) list.push(navKey); }
  else { perms[role] = list.filter(k=>k!==navKey); }
  persist();
  if(CURRENT_USER && CURRENT_USER.role===role){
    if(!getRoleNav(role).includes(ROUTE)) ROUTE = getRoleNav(role)[0] || 'dashboard';
    renderNav(); renderRoute();
  }
}

async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;

  catch(e){ err.textContent='Cannot reach the central server. Check the server URL below.'; return; }
  const user = DB.users.find(x=>x.username===u && x.password===p);
  if(!user){ err.textContent='Incorrect username or password.'; return; }
  err.textContent='';
  CURRENT_USER = user;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  ROUTE = getRoleNav(user.role)[0] || 'dashboard';
  renderNav();
  renderRoute();
}

  CURRENT_USER=null;
  document.getElementById('app').classList.remove('active');

}

function agingInfo(openedDate){
  const days = daysBetween(new Date(openedDate), new Date());
  let color, cls;
  if(days<7){ color='var(--green)'; cls='tag-green'; }
  else if(days<14){ color='var(--amber)'; cls='tag-amber'; }
  else if(days<30){ color='var(--orange)'; cls='tag-orange'; }
  else { color='var(--red)'; cls='tag-red'; }
  const pct = Math.min(100, Math.round((days/45)*100));
  return {days,color,cls,pct};
}
function agingRuler(openedDate){
  const a = agingInfo(openedDate);
  return `<div class="ruler"><div class="ruler-track"><div class="ruler-fill" style="width:${a.pct}%; background:${a.color}"></div></div><div class="ruler-days mono" style="color:${a.color}">${a.days}d</div></div>`;
}
function stageTag(stage){
  const map = {Sourced:'tag-gray', Screened:'tag-blue', Submitted:'tag-blue', Interview:'tag-amber', Offer:'tag-orange', Joined:'tag-green', Rejected:'tag-red', Dropped:'tag-red'};
  return `<span class="tag ${map[stage]||'tag-gray'}">${stage}</span>`;
}

function showToast(msg){

  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* CSV export */
function exportCSV(rows, filename){
  if(!rows.length){ showToast('Nothing to export yet.'); return; }
  const cols = Object.keys(rows[0]);
  const csv = [cols.join(',')].concat(rows.map(r=>cols.map(c=>{
    let v = r[c]===undefined||r[c]===null ? '' : String(r[c]);
    v = v.replace(/"/g,'""');
    return /[",\n]/.test(v) ? `"${v}"` : v;
  }).join(','))).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function openModal(title, fields, values, onSubmit, opts){
  opts = opts || {};
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <div class="modal-title">${esc(title)}<button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="modalForm" onsubmit="return false;">
      ${fields.map(f=>renderField(f, values[f.key])).join('')}
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="modalSubmitBtn">${opts.submitLabel||'Save'}</button>
      </div>
    </form>`;
  overlay.classList.add('active');
  document.getElementById('modalSubmitBtn').onclick = ()=>{
    const out = {};
    let valid = true;
    fields.forEach(f=>{
      const el = document.getElementById('mf_'+f.key);
      let v = el.value;
      if(f.required && !v){ valid=false; el.style.borderColor='var(--red)'; }
      out[f.key] = f.type==='number' ? (v===''?'':Number(v)) : v;
    });
    if(!valid){ showToast('Please fill required fields.'); return; }
    onSubmit(out);
    closeModal();
  };
}
function renderField(f, val){
  val = val===undefined||val===null? '' : val;
  const req = f.required ? 'required' : '';
  if(f.type==='select'){
    return `<div class="field"><label>${esc(f.label)}</label>
      <select id="mf_${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${esc(f.label)}</label><textarea id="mf_${f.key}" rows="3">${esc(val)}</textarea></div>`;
  }
  return `<div class="field"><label>${esc(f.label)}</label><input id="mf_${f.key}" type="${f.type||'text'}" value="${esc(val)}" ${req}></div>`;
}

function handleSearchInput(val){
  SEARCH_QUERY = val;
  const el = document.getElementById('searchResults');
  if(el) el.innerHTML = renderSearchResults();
}
function renderSearchResults(){
  const query = SEARCH_QUERY.trim();
  if(!query) return emptyState('Start typing key skills above to search your candidate database.');
  const tokens = query.split(/[,\s]+/).map(t=>t.trim().toLowerCase()).filter(Boolean);
  if(!tokens.length) return emptyState('Start typing key skills above to search your candidate database.');

  const results = DB.candidates.map(c=>{
    const candSkills = (c.skills||'').split(',').map(s=>s.trim()).filter(Boolean);
    const candSkillsLower = candSkills.map(s=>s.toLowerCase());
    const matchedTokens = tokens.filter(t => candSkillsLower.some(cs => cs.includes(t) || t.includes(cs)));
    return { candidate:c, candSkills, matchedTokens, score: matchedTokens.length };
  }).filter(r=>r.score>0).sort((a,b)=> b.score - a.score);

  if(!results.length) return emptyState(`No candidates match "${esc(query)}". Try fewer or different skills.`);

  return `
    <div style="font-size:12.5px;color:var(--steel);font-weight:600;margin-bottom:12px;">${results.length} matching candidate${results.length===1?'':'s'}, ranked by best match</div>
    ${results.map(r=>{
      const c = r.candidate;
      const active = DB.submissions.filter(s=>s.candidateId===c.id && !TERMINAL.includes(s.stage)).length;
      const skillBadges = r.candSkills.map(s=>{
        const isMatch = r.matchedTokens.some(t => s.toLowerCase().includes(t) || t.includes(s.toLowerCase()));
        return `<span class="tag ${isMatch?'tag-green':'tag-gray'}" style="margin:2px 4px 2px 0;">${esc(s)}</span>`;
      }).join('');
      return `
      <div class="card" style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div style="flex:1; min-width:240px;">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px; flex-wrap:wrap;">
            <b style="font-size:15px;font-family:'Fraunces',serif;">${esc(c.name)}</b>
            <span class="tag tag-blue">${r.score}/${tokens.length} skills matched</span>
          </div>
          <div style="font-size:12.5px;color:var(--steel);margin-bottom:8px;">${esc(c.email)} · ${esc(c.phone)} · <span class="tag tag-gray" style="margin-left:2px;">${esc(c.source)}</span></div>
          <div>${skillBadges}</div>
          ${active>0?`<div style="font-size:11.5px;color:var(--steel);margin-top:8px;">Currently in ${active} active pipeline${active===1?'':'s'}</div>`:''}
        </div>
        <div class="row-actions" style="flex-shrink:0;">
          <button class="btn btn-ghost btn-sm" onclick="openCandidateDetail('${c.id}')">View Profile</button>
          <button class="btn btn-amber btn-sm" onclick="openSubModal(null,'${c.id}')">Submit</button>
        </div>
      </div>`;
    }).join('')}`;
}

function deleteClient(clientId){
  const c = DB.clients.find(x=>x.id===clientId); if(!c) return;
  const relatedReqs = DB.requirements.filter(r=>r.clientId===clientId);
  const relatedSubsCount = relatedReqs.reduce((n,r)=> n + DB.submissions.filter(s=>s.requirementId===r.id).length, 0);
  const warning = relatedReqs.length
    ? `Delete "${c.name}"? This also removes ${relatedReqs.length} requirement(s) and ${relatedSubsCount} linked submission(s), along with their interviews, offers, and joining records. This cannot be undone.`
    : `Delete "${c.name}"? This cannot be undone.`;
  if(!confirm(warning)) return;
  relatedReqs.forEach(r=>{
    DB.submissions.filter(s=>s.requirementId===r.id).forEach(s=>cascadeRemoveSubmission(s.id));
  });
  DB.requirements = DB.requirements.filter(r=>r.clientId!==clientId);
  DB.clients = DB.clients.filter(x=>x.id!==clientId);
  persist(); renderRoute(); showToast('Client deleted.');
}

/* ============================= CLIENT DASHBOARD (MONTHLY) ============================= */
function clientMonthlyStats(monthStr){
  return DB.clients.map(client=>{
    const reqIds = DB.requirements.filter(r=>r.clientId===client.id).map(r=>r.id);
    const clientSubs = DB.submissions.filter(s=>reqIds.includes(s.requirementId));

    const totalSubmissions = clientSubs.filter(s=> (s.createdAt||'').slice(0,7)===monthStr).length;

    const joined = DB.joinings.filter(j=>{
      if(j.status!=='Joined' || !j.actualDate || j.actualDate.slice(0,7)!==monthStr) return false;
      const s = subById(j.submissionId);
      return s && reqIds.includes(s.requirementId);
    }).length;

    const pipelineCount = clientSubs.filter(s=> !TERMINAL.includes(s.stage) && s.stage!=='Joined').length;

    const dropped = clientSubs.filter(s=> TERMINAL.includes(s.stage) && (s.updatedAt||'').slice(0,7)===monthStr).length;

    return { client, totalSubmissions, joined, pipelineCount, dropped };
  }).sort((a,b)=> b.totalSubmissions - a.totalSubmissions);
}
function shiftClientDashMonth(delta){
  const [y,m] = CLIENT_DASH_MONTH.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  CLIENT_DASH_MONTH = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  renderRoute();
}

function deleteRequirement(reqId){

  const relatedSubs = DB.submissions.filter(s=>s.requirementId===reqId);
  const warning = relatedSubs.length
    ? `Delete "${r.title}"? This also removes ${relatedSubs.length} linked submission(s), along with their interviews, offers, and joining records. This cannot be undone.`
    : `Delete "${r.title}"? This cannot be undone.`;

  relatedSubs.forEach(s=>cascadeRemoveSubmission(s.id));

async function handleResumeFileChosen(candidateId){
  const input = document.getElementById('resumeFileInput');
  const file = input.files[0];
  if(!file) return;
  const btn = document.getElementById('resumeUploadBtn');
  const originalLabel = btn.textContent;
  btn.textContent = 'Uploading…'; btn.disabled = true;
  try{
    const formData = new FormData();
    formData.append('candidateId', candidateId);
    formData.append('resume', file);
    const res = await fetch(getApiBase()+'/api/resumes/upload', { method:'POST', body: formData });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Upload failed.');
    const c = DB.candidates.find(x=>x.id===candidateId);
    if(c){ c.resumeUrl = data.url; logActivity(candidateId, `Resume uploaded (${file.name}).`); }
    await persist();
    showToast('Resume uploaded.');
    openCandidateDetail(candidateId);
  }catch(e){
    console.error(e);
    showToast(e.message || 'Resume upload failed — check server connection.');
    btn.textContent = originalLabel; btn.disabled = false;
  }
}

function renderPipeline(){
  let subs = DB.submissions.filter(s=>!TERMINAL.includes(s.stage));
  if(CURRENT_USER.role==='recruiter') subs = subs.filter(s=>s.recruiter===CURRENT_USER.username);
  if(PIPELINE_FILTER!=='all') subs = subs.filter(s=>s.requirementId===PIPELINE_FILTER);
  return `

    </div>
  </div>
  <div class="kanban">
    ${STAGES.map(stage=>{
      const cards = subs.filter(s=>s.stage===stage);
      return `<div class="kcol">
        <div class="kcol-head"><span class="kcol-title">${stage}</span><span class="kcol-count">${cards.length}</span></div>
        ${cards.map(s=>{
          const idx = STAGES.indexOf(stage);
          const nextStage = STAGES[idx+1];
          const cand = DB.candidates.find(x=>x.id===s.candidateId) || {};
          const infoParts = [];
          if(cand.cid) infoParts.push(`CID ${esc(cand.cid)}`);
          if(cand.yearsExp!==undefined && cand.yearsExp!=='') infoParts.push(`${esc(cand.yearsExp)} yrs`);
          if(cand.location) infoParts.push(esc(cand.location));
          const ctcParts = [];
          if(cand.currentCtc) ctcParts.push(`Cur: ${esc(cand.currentCtc)}`);
          if(cand.expectedCtc) ctcParts.push(`Exp: ${esc(cand.expectedCtc)}`);
          return `<div class="kcard" onclick="openCandidateDetail('${s.candidateId}')">

            ${infoParts.length?`<div style="font-size:10.5px;color:var(--steel);margin-top:4px;">${infoParts.join(' · ')}</div>`:''}
            ${ctcParts.length?`<div style="font-size:10.5px;color:var(--steel);margin-top:2px;">${ctcParts.join(' · ')}</div>`:''}
            <div class="kcard-foot">
              <span class="kcard-rec">${esc(userName(s.recruiter))}</span>
              <span class="kcard-move" onclick="event.stopPropagation()">
                ${nextStage?`<button class="mini-btn" title="Advance to ${nextStage}" onclick="moveStage('${s.id}','${nextStage}')">&#8594;</button>`:''}
                <button class="mini-btn rej" title="Reject" onclick="moveStage('${s.id}','Rejected')">&#10005;</button>

              </span>

function moveStage(subId, newStage){
  const s = subById(subId); if(!s) return;
  const prev = s.stage; s.stage = newStage; s.updatedAt = nowIso();
  logActivity(s.candidateId, `Stage changed from "${prev}" to "${newStage}".`);
  persist(); renderRoute(); showToast(`Moved to ${newStage}.`);
}
// Removes a submission and everything hanging off it (interviews, offers, joinings),
// without confirmation/persist/toast — used both directly and by higher-level deletes
// (requirement, client, candidate) that need to cascade through many submissions at once.
function cascadeRemoveSubmission(subId){
  DB.interviews = DB.interviews.filter(i=>i.submissionId!==subId);
  DB.offers = DB.offers.filter(o=>o.submissionId!==subId);
  DB.joinings = DB.joinings.filter(j=>j.submissionId!==subId);
  DB.submissions = DB.submissions.filter(x=>x.id!==subId);
}
function deleteSubmission(subId){
  const s = subById(subId); if(!s) return;
  const candidateName = candName(s.candidateId);
  const reqName = reqTitle(s.requirementId);
  if(!confirm(`Remove ${candidateName} from the pipeline for "${reqName}"? This also deletes any linked interviews, offers, and joining records for this submission. This cannot be undone.`)) return;
  logActivity(s.candidateId, `Removed from pipeline for "${reqName}" (submission deleted).`);
  cascadeRemoveSubmission(subId);
  persist(); renderRoute(); showToast('Submission removed.');
}

/* ============================= PERFORMANCE ============================= */
function recruiterScores(weights){
  const recruiters = DB.users.filter(u=>u.role==='recruiter'||u.role==='teamlead'||u.role==='head'||u.role==='superadmin');
  const scored = recruiters.map(u=>{
    const subs = DB.submissions.filter(s=>s.recruiter===u.username).length;
    const ivs = DB.interviews.filter(i=>{ const s=subById(i.submissionId); return s && s.recruiter===u.username; }).length;
    const offs = DB.offers.filter(o=>{ const s=subById(o.submissionId); return s && s.recruiter===u.username; }).length;
    const joins = DB.joinings.filter(j=>{ const s=subById(j.submissionId); return s && s.recruiter===u.username; }).length;
    const score = subs*weights.submission + ivs*weights.interview + offs*weights.offer + joins*weights.join;
    return {username:u.username, name:u.name, subs,ivs,offs,joins,score};
  }).filter(r=>r.subs+r.ivs+r.offs+r.joins>0);
  const max = Math.max(1, ...scored.map(s=>s.score));
  scored.forEach(s=> s.pct = Math.round((s.score/max)*100));
  return scored.sort((a,b)=>b.score-a.score);
}
function bestPerformersForMonth(monthStr){
  const joinedInMonth = DB.joinings.filter(j=>j.status==='Joined' && j.actualDate && j.actualDate.slice(0,7)===monthStr);
  const byRecruiter = {};
  joinedInMonth.forEach(j=>{
    const s = subById(j.submissionId); if(!s) return;
    const req = DB.requirements.find(r=>r.id===s.requirementId);
    const client = req ? DB.clients.find(c=>c.id===req.clientId) : null;
    const achievement = {
      candidateName: candName(s.candidateId),
      clientName: client ? client.name : '—',
      clientLocation: client ? (client.location||'') : '',
      requirementTitle: req ? req.title : '—',
      joinDate: j.actualDate
    };
    if(!byRecruiter[s.recruiter]) byRecruiter[s.recruiter] = [];
    byRecruiter[s.recruiter].push(achievement);
  });
  return Object.entries(byRecruiter).map(([username, achievements])=>({
    username, name: userName(username), achievements, count: achievements.length
  })).sort((a,b)=> b.count - a.count);
}

        <td class="name-cell"><b>${esc(s.name)}</b></td>
        <td>${s.subs}</td><td>${s.ivs}</td><td>${s.offs}</td><td>${s.joins}</td>
        <td><div style="display:flex;align-items:center;gap:8px;"><div class="perf-bar-track" style="width:100px;"><div class="perf-bar-fill" style="width:${s.pct}%"></div></div><b class="mono">${s.score}</b></div></td>
      </tr>`).join('')}
      </tbody></table>` : emptyState('No recruiter activity logged yet.')}
  </div>`;
}

/* ============================= SETTINGS ============================= */
function renderSettings(){
  const w = DB.settings.weights;
  const isSuper = CURRENT_USER.role==='superadmin';
  return `
  <div class="topbar"><div><div class="page-title">Settings</div><div class="page-sub">Scoring weights and team access.</div></div></div>
  <div class="card">
    <div class="card-title">Performance Score Weights</div>
    <div class="section-note">Score = submissions × w1 + interviews × w2 + offers × w3 + joins × w4. Adjust to match what your team values most.</div>
    <div class="weights-grid">
      <div class="field"><label>Per Submission</label><input type="number" id="w_submission" value="${w.submission}"></div>
      <div class="field"><label>Per Interview</label><input type="number" id="w_interview" value="${w.interview}"></div>
      <div class="field"><label>Per Offer</label><input type="number" id="w_offer" value="${w.offer}"></div>
      <div class="field"><label>Per Join</label><input type="number" id="w_join" value="${w.join}"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:10px;width:auto;padding:10px 20px;" onclick="saveWeights()">Save Weights</button>
  </div>
  ${isSuper? renderRolePermissionsCard() : ''}
  ${isSuper?`<div class="card">
    <div class="card-title">Data & Backup</div>
    <div class="section-note">All data lives on your central server (${esc(getApiBase())}) and is shared by everyone using this app. Back it up regularly — resetting affects every user immediately.</div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" onclick="downloadBackup()">Download Backup (JSON)</button>
      <button class="btn btn-danger" onclick="resetAllData()">Reset All Data</button>
    </div>
  </div>`:''}
  <div class="card">
    <div class="card-title">Team Members ${isSuper?`<button class="btn btn-amber btn-sm" onclick="openUserModal()">+ Add User</button>`:''}</div>
    <table><thead><tr><th>Name</th><th>Username</th><th>Role</th>${isSuper?'<th></th>':''}</tr></thead><tbody>
      ${DB.users.map(u=>`<tr class="tbl-row"><td class="name-cell"><b>${esc(u.name)}</b></td><td class="mono">${esc(u.username)}</td><td><span class="tag tag-blue">${ROLES[u.role].label}</span></td>${isSuper?`<td class="row-actions"><button class="icon-btn" onclick="openUserModal('${u.username}')">&#9998;</button></td>`:''}</tr>`).join('')}
    </tbody></table>
  </div>`;
}
function renderRolePermissionsCard(){
  const perms = ensureRolePermissions();
  const roleKeys = Object.keys(ROLES).filter(r=>r!=='superadmin');
  const navKeys = Object.keys(NAV_META);
  return `
  <div class="card">
    <div class="card-title">Role Permissions</div>
    <div class="section-note">Control which pages each role can see in the sidebar. Super Admin always has full access (not shown here) so you can't lock yourself out, and Dashboard is always visible to everyone.</div>
    <div style="overflow-x:auto;">
    <table><thead><tr><th>Page</th>${roleKeys.map(r=>`<th style="text-align:center;">${esc(ROLES[r].label)}</th>`).join('')}</tr></thead><tbody>
      ${navKeys.map(navKey=>{
        const meta = NAV_META[navKey];
        const isLocked = navKey==='dashboard';
        return `<tr class="tbl-row"><td>${esc(meta.label)}</td>${roleKeys.map(r=>{
          const checked = isLocked || (perms[r]||[]).includes(navKey);
          return `<td style="text-align:center;"><input type="checkbox" ${checked?'checked':''} ${isLocked?'disabled title="Everyone can always see the Dashboard"':''} onchange="togglePermission('${r}','${navKey}', this.checked)"></td>`;
        }).join('')}</tr>`;
      }).join('')}
    </tbody></table>
    </div>
  </div>`;
}
function saveWeights(){
  DB.settings.weights = {
    submission:Number(document.getElementById('w_submission').value)||0,
    interview:Number(document.getElementById('w_interview').value)||0,
    offer:Number(document.getElementById('w_offer').value)||0,
    join:Number(document.getElementById('w_join').value)||0
  };
  persist(); showToast('Weights updated.'); renderRoute();
}
function openUserModal(username){
  const u = username ? DB.users.find(x=>x.username===username) : {username:'', password:'', role:'recruiter', name:''};
  openModal(username?'Edit User':'Add User', [
    {key:'name', label:'Full Name', required:true},
    {key:'username', label:'Username', required:true},
    {key:'password', label:'Password', required:true},
    {key:'role', label:'Role', type:'select', options:Object.keys(ROLES)}
  ], u, (vals)=>{
    if(username){ Object.assign(u, vals); }
    else { if(DB.users.some(x=>x.username===vals.username)){ showToast('Username already exists.'); return; } DB.users.push({...vals}); }
    persist(); renderRoute(); showToast('User saved.');
  });
  setTimeout(()=>{ const sel=document.getElementById('mf_role'); if(sel) Array.from(sel.options).forEach(o=> o.textContent = ROLES[o.value].label); },0);
}

function downloadBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `recruitops-backup-${todayIso()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('Backup downloaded.');
}
function resetAllData(){
  if(!confirm('This permanently deletes all data on the central server (clients, requirements, candidates, pipeline, offers) for EVERY user and restores the demo dataset. This cannot be undone. Continue?')) return;
  DB = seedDB();
  persist();
  renderRoute();
  showToast('All data reset to demo dataset.');
}

/* ============================= INIT ============================= */
(async function init(){
  checkServerStatus();
  try{
    await loadDB();
  }catch(e){
    console.error(e);
    document.getElementById('loginError').textContent = 'Cannot reach the central server. Check the server URL below, or ask your admin to start it.';
  }
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
})();
</script>
</body>
</html>
